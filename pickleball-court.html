<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Court Replica</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #6c8a7e;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-width: 1px;
    min-height: 1px;
    background: #6c8a7e;
    overflow: hidden;
  }

  /* Main court */
  .court {
    position: absolute;
    left: 14.0%;
    top: 25.1%;
    width: 70.0%;
    height: 51.5%;
    background: #3555a2;
    border: 9px solid #fff;
    border-radius: 5px;
  }

  /* Non-volley-zone lines */
  .nvz {
    position: absolute;
    top: 0;
    height: 100%;
    width: 9px;
    background: #fff;
  }
  .nvz.left  { left: 35.35%; }
  .nvz.right { left: 64.65%; }

  /* Service-court divider lines */
  .service-line {
    position: absolute;
    left: 0;
    width: 35.35%;
    height: 9px;
    background: #fff;
    top: 50%;
    transform: translateY(-50%);
  }
  .service-line.right-half {
    left: auto;
    right: 0;
    width: 35.35%;
  }

  /*
    Net: a narrow, vertically-oriented perspective mesh in the centre.
    The white post is behind the black mesh, and the mesh has a slight
    rightward perspective tilt, matching the reference.
  */
  .net-post {
    position: absolute;
    left: 48.30%;
    top: 10.0%;
    width: 10px;
    height: 80.0%;
    background: #fff;
    z-index: 10;
  }

  .net {
    position: absolute;
    left: 48.95%;
    top: 10.0%;
    width: 27px;
    height: 80.0%;
    z-index: 11;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.98) 0 2px,
        transparent 2px 38px
      ),
      repeating-linear-gradient(
        to right,
        rgba(0,0,0,0.98) 0 2px,
        transparent 2px 8px
      );
    clip-path: polygon(0 0, 100% 7%, 100% 93%, 0 100%);
    transform: skewY(0deg);
    filter: drop-shadow(8px 10px 10px rgba(0,0,0,0.16));
  }

  /* Outer thick diagonal edge of the net plane */
  .net::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 7px;
    height: 100%;
    background: #000;
  }
  .net::after {
    content: "";
    position: absolute;
    right: 0;
    top: 6%;
    width: 5px;
    height: 88%;
    background: #000;
  }

  /* Slight soft grounding shadow around the right side of the net */
  .net-shadow {
    position: absolute;
    left: 50.3%;
    top: 13.5%;
    width: 7%;
    height: 73%;
    background: rgba(0,0,0,0.18);
    filter: blur(15px);
    opacity: .55;
    z-index: 4;
    border-radius: 50%;
    pointer-events: none;
  }

  @media (max-aspect-ratio: 1.0) {
    .court { left: 4%; width: 92%; }
    .net-post { left: 48.3%; }
    .net { left: 49%; }
    .nvz.left { left: 35.35%; }
    .nvz.right { left: 64.65%; }
  }
</style>
</head>
<body>
  <main class="scene" aria-label="Pickleball court">
    <div class="court">
      <div class="nvz left"></div>
      <div class="nvz right"></div>
      <div class="service-line"></div>
      <div class="service-line right-half"></div>
    </div>

    <div class="net-shadow"></div>
    <div class="net-post"></div>
    <div class="net"></div>
  </main>
</body>
</html>
